<!-- app-nav-bar.component.html -->
<nav class="navbar navbar-expand-lg" style="background-color: #3b44bd">
  <div class="container-fluid">
    <!-- Logo + Brand -->
    <a class="navbar-brand d-flex align-items-center text-white" routerLink="/">
      <img src="favicon.ico" alt="Logo" height="40" class="me-2" />
      <span>E-commerce</span>
    </a>

    <!-- Toggler for mobile -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links + Search + Icons -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Navigation Links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a
            class="nav-link text-white"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            >Home</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" routerLink="/shop" routerLinkActive="active">Shopping</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" routerLink="/about">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" routerLink="/best-seller">Best Seller</a>
        </li>
      </ul>

      <!-- Search -->
      <form class="d-flex me-3">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
        <button class="btn btn-pink text-white" type="submit" style="background-color: #ff007f">
          Search
        </button>
      </form>

      <!-- Cart + User -->
      <ul class="navbar-nav mb-2 mb-lg-0 d-flex align-items-center">
        <li class="nav-item me-3">
          <a class="nav-link text-white" href="#">
            <i class="bi bi-cart-fill"></i>
          </a>
        </li>
        <li class="nav-item dropdown">
          <a
            class="nav-link text-white dropdown-toggle"
            href="#"
            id="userDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="bi bi-person-circle"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" href="#">Profile</a></li>
            <li><a class="dropdown-item" href="#">Settings</a></li>
            <li><hr class="dropdown-divider" /></li>
            <li><a class="dropdown-item" href="#">Logout</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
