<div class="container mt-5">
  <div class="row">
    <!-- Sidebar Filters -->
    <aside class="col-md-3">
      <div class="sidebar">
        <!-- Sorting -->
        <div class="filter-card p-3 mb-4">
          <label class="filter-label mb-2">Sorting</label>
          <p-dropdown
            [options]="sortingOptions"
            placeholder="Sort by"
            optionLabel="name"
            styleClass="w-100"
            [(ngModel)]="selectedSort"
            (onChange)="onSortChange($event)"
          ></p-dropdown>
        </div>

        <!-- Categories -->
        <div class="filter-card p-3">
          <label class="filter-label mb-2">Categories</label>
          <p-listbox
            [options]="categories"
            optionLabel="name"
            class="category-listbox w-100"
            scrollHeight="none"
            [(ngModel)]="selectedCategory"
            (onChange)="onCategoryChange($event)"
          ></p-listbox>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="col-md-9">
      <!-- Paging & Search -->
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div class="paging-container">
          <span class="text-dark">Showing {{ products.length }} of {{ totalCount }}</span>
        </div>

        <div class="search-container flex-grow-1">
          <div class="input-group">
            <input
              type="text"
              [(ngModel)]="productParams.search"
              (keyup.enter)="onSearch(productParams.search || '')"
              (keyup)="onSearch(productParams.search || '')"
              class="form-control"
              placeholder="Search ..."
            />
            <button class="btn btn-danger" (click)="onSearch(productParams.search || '')">
              Search
            </button>
            <button class="btn btn-dark" (click)="onReset()">Reset</button>
          </div>
        </div>
      </div>

      <!-- Cards List -->
      @if (products.length > 0) {
      <div class="row g-4">
        @for (product of products; track product.name) {
        <app-shop-item [product]="product" class="col-lg-4 col-md-6"></app-shop-item>
        }
      </div>
      } @else {
      <div class="text-center py-5">
        @if (isLoading) {
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        } @else {
        <div class="mt-3">
          <h5 class="text-muted">No products found</h5>
          <p class="text-muted">Try adjusting your search or filter criteria.</p>
        </div>
        }
      </div>
      }

      <div class="d-flex justify-content-center align-items-center mt-5">
        <app-pagination-component
          [pageSize]="productParams.pageSize"
          [totalCount]="totalCount"
          (pageChanged)="onPageChanged($event)"
        ></app-pagination-component>
      </div>
    </main>
  </div>
</div>
