<div class="container mt-5">
  <div class="row">
    <!-- Sidebar Filters -->
    <aside class="col-md-3">
      <div class="sidebar">
        <!-- Sorting -->
        <div class="filter-card p-3 mb-4">
          <label class="filter-label mb-2">Sorting</label>
          <p-dropdown
            [options]="sortingOptions"
            placeholder="Sort by"
            optionLabel="name"
            styleClass="w-100"
            (onChange)="onSortChange($event)"
          ></p-dropdown>
        </div>

        <!-- Categories -->
        <div class="filter-card p-3">
          <label class="filter-label mb-2">Categories</label>
          <p-listbox
            [options]="categories"
            optionLabel="name"
            class="category-listbox w-100"
            (onChange)="onCategoryChange($event)"
          ></p-listbox>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="col-md-9">
      <!-- Paging & Search -->
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div class="paging-container">
          <span class="text-dark">Showing 3 of 5</span>
        </div>

        <div class="search-container flex-grow-1">
          <div class="input-group">
            <input type="text" class="form-control" placeholder="Search ..." />
            <button class="btn btn-danger">Search</button>
            <button class="btn btn-dark">Reset</button>
          </div>
        </div>
      </div>

      <!-- Cards List -->
      <div class="row g-4" *ngIf="products.length > 0; else noProducts">
        <app-shop-item
          *ngFor="let product of products"
          [product]="product"
          class="col-lg-4 col-md-6"
        ></app-shop-item>
      </div>

      <!-- No Products Message -->
      <ng-template #noProducts>
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status" *ngIf="isLoading">
            <span class="visually-hidden">Loading...</span>
          </div>
          <div *ngIf="!isLoading && products.length === 0" class="mt-3">
            <h5 class="text-muted">No products found</h5>
            <p class="text-muted">Try adjusting your search or filter criteria.</p>
          </div>
        </div>
      </ng-template>
    </main>
  </div>
</div>
