<div class="container mt-5">
  <div class="row">

    <!-- Sidebar Filters -->
    <aside class="col-md-3">
      <div class="sidebar">

        <!-- Sorting -->
        <div class="filter-card p-3 mb-4">
          <label class="filter-label mb-2">Sorting</label>
          <p-dropdown
            [options]="sortingOptions"
            placeholder="Sort by"
            optionLabel="name"
            styleClass="w-100"
          ></p-dropdown>
        </div>

        <!-- Categories -->
        <div class="filter-card p-3">
          <label class="filter-label mb-2">Categories</label>
          <p-listbox
            [options]="categories"
            optionLabel="name"
            class="category-listbox w-100"
          ></p-listbox>
        </div>

      </div>
    </aside>

    <!-- Main Content -->
    <main class="col-md-9">

      <!-- Paging & Search -->
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

        <div class="paging-container">
          <span class="text-dark">Showing 3 of 5</span>
        </div>

        <div class="search-container flex-grow-1">
          <div class="input-group">
            <input type="text" class="form-control" placeholder="Search ...">
            <button class="btn btn-danger">Search</button>
            <button class="btn btn-dark">Reset</button>
          </div>
        </div>

      </div>

      <!-- Cards List -->
      <div class="row g-4">
        <div class="product-item col-lg-4 col-md-6">
          <div class="card h-100">
            <img src="https://i.pinimg.com/1200x/78/bf/a8/78bfa893270a0b531705b1c56f25674d.jpg" class="image-top" alt="">
            <div class="card-body">
              <div class="thumbnails mb-3">
                <img src="https://i.pinimg.com/1200x/78/bf/a8/78bfa893270a0b531705b1c56f25674d.jpg" alt="" class="thumbnail-img small-img">
                <img src="https://i.pinimg.com/736x/43/54/b1/4354b1d283e36eabba8c09a8f55803be.jpg" alt="" class="thumbnail-img small-img">
                <img src="https://i.pinimg.com/1200x/6d/51/b5/6d51b5c3fe6ce210a6fc1c7c493bed46.jpg" alt="" class="thumbnail-img small-img">
              </div>
              <h5 class="card-title">Lorem ipsum dolor.</h5>
              <p class="card-text">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Aliquid doloremque porro sunt!</p>
              <p class="price">
                <span class="old-price">{{ 100 | currency }}</span>
                {{ 900 | currency }}
              </p>
              <div class="rating mb-3">

              </div>
              <button class="btn btn-outline-primary favourite-icon">
                <i class="fa fa-bookmark"></i>
              </button>
              <div class="d-flex justify-content-between align-items-start">
                <button class="btn btn-dark">
                  <i class="fa fa-shopping-cart"></i> Add to Cart
                </button>
                <button class="btn btn-success">
                  <i class="fa fa-info-circle"></i> Details
                </button>
              </div>
            </div>
          </div>

        </div>

      </div>

    </main>

  </div>
</div>
